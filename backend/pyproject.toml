[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shortlink-api"
version = "0.1.0"
description = "ShortLink URL shortener API and asynchronous analytics worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.14.1",
  "SQLAlchemy==2.0.50",
  "alembic==1.18.4",
  "psycopg[binary]==3.3.6",
  "redis==6.2.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
